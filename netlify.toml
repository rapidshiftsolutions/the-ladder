[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://the-ladder.org"

# Form processing settings
[forms]
  enable = true

# Development settings
[dev]
  framework = "next"
  targetPort = 3000
  port = 8888
  command = "next dev"

# Enable Netlify Next.js Runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "netlify-plugin-cache-nextjs"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com https://cdn.acsbapp.com https://widgets.givebutter.com https://givebutter.com https://*.givebutter.com https://givebuttercdn.com https://*.givebuttercdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://widgets.givebutter.com https://givebutter.com https://*.givebutter.com https://givebuttercdn.com https://*.givebuttercdn.com; font-src 'self' https://fonts.gstatic.com data: https://givebuttercdn.com https://*.givebuttercdn.com; img-src 'self' data: https: blob: https://cdn.sanity.io https://givebutter.com https://*.givebutter.com https://givebuttercdn.com; connect-src 'self' https://www.google.com https://www.google-analytics.com https://vitals.vercel-insights.com https://*.vercel-scripts.com https://*.sanity.io https://*.api.sanity.io https://widgets.givebutter.com https://givebutter.com https://*.givebutter.com https://givebuttercdn.com https://*.givebuttercdn.com; frame-src 'self' https://www.google.com https://givebutter.com https://*.givebutter.com; worker-src 'self' blob: https://www.google.com"

# Static assets - 1 year cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts - 1 year cache
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images - 30 day cache
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Documents
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=86400"

# Canonical domain redirect (www to non-www)
[[redirects]]
  from = "https://www.the-ladder.org/*"
  to = "https://the-ladder.org/:splat"
  status = 301
  force = true

# Force HTTPS
[[redirects]]
  from = "http://the-ladder.org/*"
  to = "https://the-ladder.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.the-ladder.org/*"
  to = "https://the-ladder.org/:splat"
  status = 301
  force = true

# Legacy URL redirects (if any old URLs need to redirect)
[[redirects]]
  from = "/testimonies"
  to = "/success-stories"
  status = 301

[[redirects]]
  from = "/login"
  to = "/guest-portal"
  status = 301

[[redirects]]
  from = "/donate-now"
  to = "/donate"
  status = 301

[[redirects]]
  from = "/apply-assistance"
  to = "/guest-portal"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/partners"
  status = 301
